<!DOCTYPE html>
<html>
    <head>
        <title>My Planet Cards</title>
        <style>
            body {
                font-family: Arial;
                background: white;
                padding:30px;
                text-align:center;
            }
            h1 { color:h1  #ff5a43; }
            p {color: #555;}
            .cards {
                display:flex;
                justify-content:center;
                gap:20px;
                margin-top:25px;
            }
            .card {
                background: white;
                border: 3px solid #ff5a43;
                border-radius:12px;
                padding:20px;
                width:200px;
            }
            .planet-name {
                font-size:22px;
                font-weight:bold;
                color:#333;
            }
            .planet-fact {color:#666; margin-top:10px; font-size:14px;}
            button {
                background: #ff5a43;
                color:white;
                border:none;
                padding:12px 28px;
                border-radius:8px;
                cursor:pointer;
                font-size:16px;
                margin-top:10px;
            }
        </style>
    </head>
    <body>
        <h1>My Planet Cards</h1>
        <p>Use a JavaScript class to build planet cards!</p>
        <button onclick="showPlanets()">Show Planets!</button>
        <div class="cards">
         <div id="card1"></div>
         <div id="card2"></div>
         <div id="card3"></div>
 </div>
 <script src="classes.js"></script>
    </body>
</html>
