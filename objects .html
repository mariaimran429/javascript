<!DOCTYPE html>
<html>
    <head>
        <title>INTRO TO OBJECTS</title>

        <style>
            body{

            }

            .card{

            margin: 50px auto;
            padding: 25px;

            border-radius: 10px;

            h1 {
                color:rgb(248, 167, 180);

            }

            p{
                font-size:20px;

             <p id="name"></p>

            <p id="school"></p>

        <script>
            let student ={
                'full name':"MARIA IMRAN",
                 age : 15,

              };

              document.getElementById("name").textContent ="Name: " + student['full name'];

              document.getElementById("city").textContent ="city :" + student.city;
