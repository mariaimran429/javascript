
<!DOCTYPE html>
<html>
<head>
  <title>My Superhero Power Cards</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #15152b;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #00e5ff;
      font-size: 36px;
    }

    p {
      color: #d6d6e7;
    }

    button {
      background-color: #7c4dff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #00bcd4;
    }

    .card-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .hero-card {
      background-color: #242444;
      border: 3px solid #00e5ff;
      border-radius: 15px;
      width: 220px;
      padding: 18px;
      box-shadow: 0 5px 15px rgba(0, 229, 255, 0.2);
    }

    .hero-card:hover {
      transform: translateY(-8px);
    }

    .hero-name {
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
    }

    .hero-power {
      color: #00e5ff;
      font-weight: bold;
    }

    .hero-mission {
      color: #c5c5d8;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>My Superhero Power Cards</h1>

  <p>
    Click the button to create superhero objects using JavaScript classes.
  </p>

  <button onclick="showHeroes()">Show Superheroes</button>

  <div class="card-container" id="heroCards"></div>

  <script>
    // What is a Class?
    // A class is a blueprint used to create objects.

    class Superhero {

      // Constructor
      constructor(name, power, mission) {

        // The this keyword stores values inside the object
        this.name = name;
        this.power = power;
        this.mission = mission;
      }

      // Class Method
      describeHero() {
        return "<div class='hero-card'>" +
               "<p class='hero-name'>" + this.name + "</p>" +
               "<p class='hero-power'>Power: " + this.power + "</p>" +
               "<p class='hero-mission'>Mission: " + this.mission + "</p>" +
               "</div>";
      }
    }

    function showHeroes() {

      // Creating Objects
      let hero1 = new Superhero(
        "Captain Code",
        "Debugging errors",
        "Fix broken programs and save the coding world."
      );

      let hero2 = new Superhero(
        "Pixel Flash",
        "Super speed design",
        "Build colourful websites in seconds."
      );

      let hero3 = new Superhero(
        "Logic Girl",
        "Smart problem-solving",
        "Use logic to solve tricky challenges."
      );

      let hero4 = new Superhero(
        "Data Knight",
        "Data protection",
        "Keep important information safe."
      );

      document.getElementById("heroCards").innerHTML =
        hero1.describeHero() +
        hero2.describeHero() +
        hero3.describeHero() +
        hero4.describeHero();
    }
  </script>

</body>
</html>
