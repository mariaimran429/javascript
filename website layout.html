<!DOCTYPE html>
<html lang="en">
<head>
    <title>Susan's Restaurant</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #5c2c06;
        }

        .navbar-brand {
            color: white !important;
            font-size: 24px;
        }

        .nav-link {
            color: white !important;
            margin-left: 15px;
        }

        .banner {
            flex: 1;
            background-image: url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .banner h1 {
            font-size: 50px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 15px 25px;
        }

        .footer {
            background-color: #5c2c06;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .footer p {
            margin: 0;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-md navbar-dark">

        <a class="navbar-brand" href="#">Susan's Restaurant</a>

        <button class="navbar-toggler" type="button"
                data-toggle="collapse" data-target="#myNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="myNavbar">

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Menu</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>

            </ul>

        </div>

    </nav>

    <!-- Banner -->
    <div class="banner">

        <div>
            <h1>Welcome to Susan's Restaurant</h1>
        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2026 Susan's Restaurant | All Rights Reserved</p>
    </div>


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
